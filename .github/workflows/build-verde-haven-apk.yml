name: Build Verde Haven Android APK

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: 'Backend URL accessible from phone, e.g. http://192.168.1.10:4000'
        required: true
        type: string

jobs:
  android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare project folders
        shell: bash
        run: |
          FILE="$(find . -type f -name capacitor.config.ts -not -path '*/node_modules/*' -print -quit)"
          if [ -z "$FILE" ]; then
            echo "Android project not found"
            exit 1
          fi

          PROJECT="$(dirname "$(dirname "$FILE")")"

          if [ ! -f "$PROJECT/frontend/package.json" ]; then
            echo "Frontend not found"
            exit 1
          fi

          if [ "$PROJECT" != "." ]; then
            mkdir -p frontend mobile
            rsync -a --exclude=node_modules --exclude=dist --exclude='.env*' "$PROJECT/frontend/" frontend/
            rsync -a --exclude=node_modules --exclude=dist --exclude='.env*' "$PROJECT/mobile/" mobile/
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install website dependencies
        run: npm ci --prefix frontend

      - name: Build existing website
        run: npm run build --prefix frontend

      - name: Configure Android backend URL
        env:
          BACKEND_URL: ${{ inputs.backend_url }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          url = os.environ["BACKEND_URL"].strip().rstrip("/")
          if not url.startswith(("http://", "https://")):
              raise SystemExit("Invalid backend URL")

          for f in Path("frontend/dist").rglob("*"):
              if f.is_file() and f.suffix in (".js", ".css", ".html"):
                  s = f.read_text(encoding="utf-8")
                  s = s.replace("http://localhost:4000", url)
                  s = s.replace("http://127.0.0.1:4000", url)
                  f.write_text(s, encoding="utf-8")
          PY

      - name: Install mobile dependencies
        run: npm ci --prefix mobile

      - name: Prepare website as Android UI
        env:
          BACKEND_URL: ${{ inputs.backend_url }}
        run: |
          mkdir -p mobile/dist
          cp -a frontend/dist/. mobile/dist/

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("mobile/capacitor.config.ts")
          config = path.read_text()

          if re.search(r"\bwebDir\s*:", config):
              config = re.sub(
                  r"webDir\s*:\s*['\"][^'\"]+['\"]",
                  "webDir: 'dist'",
                  config
              )
          else:
              config = config.replace(
                  "const config: CapacitorConfig = {",
                  "const config: CapacitorConfig = {\n  webDir: 'dist',"
              )

          path.write_text(config)

          if os.environ["BACKEND_URL"].startswith("http://"):
              manifest = Path(
                  "mobile/android/app/src/main/AndroidManifest.xml"
              )
              xml = manifest.read_text()
              if "android:usesCleartextTraffic" not in xml:
                  xml = xml.replace(
                      "<application",
                      '<application android:usesCleartextTraffic="true"',
                      1
                  )
                  manifest.write_text(xml)
          PY

      - name: Sync Capacitor
        working-directory: mobile
        run: npx cap sync android

      - name: Build APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Verde Haven APK
        uses: actions/upload-artifact@v4
        with:
          name: Verde-Haven-Android-APK
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
